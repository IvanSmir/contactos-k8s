version: '3.8'
services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    container_name: jenkins
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/root/.kube                      # kubeconfig de Minikube
      - ~/.minikube:/root/.minikube              # certificados de Minikube
    restart: unless-stopped
    user: root

volumes:
  jenkins_data:
