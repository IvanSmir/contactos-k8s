apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: devops-lab
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
        access: proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: devops-lab
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: DevOps Lab
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app
  namespace: devops-lab
data:
  app-dashboard.json: |
    {
      "title": "Contactos App - Monitoreo",
      "uid": "contactos-app",
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Requests Total",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{"expr": "sum(http_requests_total)", "datasource": "Prometheus"}]
        },
        {
          "id": 2,
          "title": "Requests por ruta",
          "type": "bargauge",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [{"expr": "sum by(route) (http_requests_total)", "legendFormat": "{{route}}", "datasource": "Prometheus"}]
        },
        {
          "id": 3,
          "title": "Memoria del Backend (bytes)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [{"expr": "process_resident_memory_bytes", "legendFormat": "Memoria RSS", "datasource": "Prometheus"}]
        },
        {
          "id": 4,
          "title": "CPU del Backend",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [{"expr": "rate(process_cpu_seconds_total[1m])", "legendFormat": "CPU", "datasource": "Prometheus"}]
        },
        {
          "id": 5,
          "title": "Requests por status HTTP",
          "type": "piechart",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [{"expr": "sum by(status) (http_requests_total)", "legendFormat": "HTTP {{status}}", "datasource": "Prometheus"}]
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: devops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin123"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard-app
              mountPath: /var/lib/grafana/dashboards/app-dashboard.json
              subPath: app-dashboard.json
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-app
          configMap:
            name: grafana-dashboard-app
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: devops-lab
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
